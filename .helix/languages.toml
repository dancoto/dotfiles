# vtsls config
[language-server.typescript-language-server]
command = "vtsls"
args = ["--stdio"]
config.hostInfo = "helix"

[language-server.typescript-language-server.config.typescript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.enumMemberValues.enabled = true
format.enable = false
format.semicolons = "remove"
preferences.importModuleSpecifier = "non-relative"
preferences.importModuleSpecifierEnding = "auto"

# tsgo config
[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.tsgo.config.typescript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.enumMemberValues.enabled = true
format.enable = false
tsserver.experimental.enableProjectDiagnostics = true

# go config
[language-server.gopls]
command = "gopls"

[language-server.gopls.config]
# diagnosticsTrigger = "Save"
usePlaceholders = true
staticcheck = true
vulncheck = "Imports" # or "All"
gofumpt = true

[language-server.gopls.config.analyses]
unusedfunc = true
unusedparams = true
unreachable = true
unusedvariable = true

[language-server.gopls.config.hints]
compositeLiteralTypes = true

# Frontend Language Config
[[language]]
name = "angular"
scope = "source.angular"
injection-regex = "html"
file-types = ["component.html", "html"] # Angular 21+ updated the naming format
block-comment-tokens = { start = "<!--", end = "-->" }
language-servers = ["angular"]
roots = ["project.json"]
formatter = { command = 'npx', args = ["prettier", "--parser", "html"] }
auto-format = true
[language.auto-pairs]
'(' = ')'
'{' = '}'
'"' = '"'
"'" = "'"

[[grammar]]
name = "angular"
source = { git = "https://github.com/dlvandenberg/tree-sitter-angular", rev = "f0d0685701b70883fa2dfe94ee7dc27965cab841" }

[[language]]
name = "typescript"
auto-format = true
language-servers = [
   "angular",
   { name = "tsgo", except-features = ["format", "completion", "code-action", "goto-reference"] }, # Angular handles file references
   { name = "typescript-language-server", only-features = ["completion", "code-action"] },
]
formatter = { command = 'npx', args = ["prettier", "--parser", "typescript"] }
roots = ["package.json"]

[[language]]
name = "scss"
auto-format = true
formatter = { command = 'npx', args = ["prettier", "--parser", "scss"] }
roots = ["package.json"]

[[language]]
name = "json"
auto-format = true
# language-servers = ["json-ls"]
formatter = { command = 'npx', args = ["prettier", "--parser", "json"] }
roots = ["package.json"]


# Backend Language Config
[[language]]
name = "go"
indent = { tab-width = 2, unit = " " }
auto-format = true
language-servers = ["gopls"]
formatter = { command = "gofumpt" }

